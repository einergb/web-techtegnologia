services:
  web:
    container_name: tienda-web
    build:
      context: .
      args:
        IMAGE_HOSTS: ${IMAGE_HOSTS:-img.codeconheiner.com}
    restart: unless-stopped
    ports:
      - "192.168.0.150:3000:3000"
    env_file:
      - .env
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://tienda-api:8080}
      SITE_URL: ${SITE_URL:?Defina SITE_URL en el archivo .env}
      PROXY_MAX_BODY_BYTES: ${PROXY_MAX_BODY_BYTES:-8388608}
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
